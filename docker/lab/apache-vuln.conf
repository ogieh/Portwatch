# Apache 2.4.49 in the configuration that CVE-2021-41773 requires to be
# exploitable: cgi-bin enabled and the filesystem root granted. This exists ONLY
# inside the loopback-bound lab so the live nmap script http-vuln-cve2021-41773
# has a genuine positive to confirm, and so the differential harness can prove
# the scanner catches a real CVE rather than a simulated one. Never deploy this.
ServerRoot "/usr/local/apache2"
Listen 80
ServerName apache-vuln

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgid_module modules/mod_cgid.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so

User daemon
Group daemon

DocumentRoot "/usr/local/apache2/htdocs"

# The two conditions that make 2.4.49 traversable:
<Directory />
    Require all granted
    Options Indexes FollowSymLinks
</Directory>

ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    Require all granted
    Options +ExecCGI
</Directory>

TypesConfig conf/mime.types
