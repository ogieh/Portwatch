# A deliberately well-configured web host. Every security header PortWatch's
# scoring looks for is present, so a correct scan should grade this host well
# and flag no missing-header deductions.
server {
    listen 80 default_server;
    server_name _;

    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # Only safe methods.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        return 200 "portwatch lab: clean-web\n";
        default_type text/plain;
    }
}
